<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:image" content="{{ og_image }}">
<meta property="og:locale" content="he_IL">
<meta name="theme-color" content="{{ c.primary }}">
<link rel="icon" href="/assets/profile.png">
<style>
@font-face{font-family:Heebo;src:url(/assets/Heebo.ttf) format("truetype");font-weight:100 900;font-display:swap}
:root{--p:{{ c.primary }};--d:{{ c.dark }};--a:{{ c.accent }};--bg:{{ c.bg }};--t:{{ c.text }}}
*{box-sizing:border-box}body{margin:0;font-family:Heebo,system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.6}
a{color:inherit}header{background:var(--d);color:#fff}
.wrap{max-width:1150px;margin:auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:900;font-size:28px}
.logo img{width:42px;height:42px;border-radius:50%}
.tg{background:var(--p);color:#fff;text-decoration:none;padding:10px 18px;border-radius:999px;font-weight:700;white-space:nowrap}
nav.cats{display:flex;gap:8px;overflow-x:auto;padding:0 0 14px}
nav.cats a{background:rgba(255,255,255,.1);padding:6px 14px;border-radius:999px;text-decoration:none;white-space:nowrap;font-size:15px}
.hero{padding:36px 0 10px}.hero h1{font-size:clamp(26px,4vw,40px);margin:0 0 6px;color:var(--d)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding:18px 0 40px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(20,33,61,.08);display:flex;flex-direction:column;text-decoration:none}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff}
.card .b{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:15px;font-weight:600;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-weight:900;font-size:22px;color:var(--d)}.price s{font-size:14px;color:#888;font-weight:400;margin-inline-start:6px}
.tag{display:inline-block;background:var(--p);color:#fff;border-radius:8px;padding:1px 8px;font-size:13px;font-weight:700}
.meta{font-size:13px;color:#555}
.btn{display:inline-block;background:var(--p);color:#fff;text-decoration:none;font-weight:800;padding:14px 26px;border-radius:14px;font-size:18px}
.product{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:28px 0}
.product img{width:100%;border-radius:18px;background:#fff}
.note{font-size:13px;color:#666;background:#fff;border-radius:12px;padding:10px 14px}
footer{background:var(--d);color:#cfd5e2;font-size:14px;padding:26px 0;margin-top:30px}
@media(max-width:760px){.product{grid-template-columns:1fr}.logo span{font-size:22px}}
</style>
{% if jsonld %}<script type="application/ld+json">{{ jsonld|safe }}</script>{% endif %}
</head>
<body>
<header><div class="wrap">
<div class="top"><a class="logo" href="/"><img src="/assets/profile.png" alt="{{ brand.name_he }}"><span>{{ brand.name_he }}</span></a>
<a class="tg" href="https://t.me/{{ brand.telegram_username }}" rel="noopener">📢 הצטרפו לטלגרם</a></div>
<nav class="cats">{% for slug, cat in cats.items() %}<a href="/c/{{ slug }}/">{{ cat.he }}</a>{% endfor %}</nav>
</div></header>
<main class="wrap">{% block body %}{% endblock %}</main>
<footer><div class="wrap">
<p><b>{{ brand.name_he }}</b> – {{ brand.slogan }}</p>
<p>{{ disclosure }}</p>
<p>{{ price_note }}</p>
<p><a href="/about/">אודות, גילוי נאות ופרטיות</a> · <a href="https://t.me/{{ brand.telegram_username }}">ערוץ הטלגרם</a></p>
</div></footer>
</body>
</html>
